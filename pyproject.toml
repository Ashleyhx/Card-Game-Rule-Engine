[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "card-game-rule-engine"
version = "1.1.0"
description = "Offline, deterministic rule engines and transparent decision policies for card games (Dominion 2E Base Set first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []   # standard library only at runtime

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cardgame = "card_game_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"card_game_engine.games.dominion.data" = ["*.json"]
"card_game_engine.games.dominion.examples" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
